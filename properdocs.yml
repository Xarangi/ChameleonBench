site_name: Next Chameleons
site_description: Benchmark and training kit for Neural-Chameleon-style activation obfuscation.
site_author: Next Chameleons contributors
site_url: https://xarangi.github.io/ChameleonBench/

docs_dir: docs
site_dir: site
repo_url: https://github.com/Xarangi/ChameleonBench
repo_name: GitHub
edit_uri: blob/main/docs/

theme:
  name: material
  font:
    text: Lora
    code: Fira Code
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: grey
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.select

extra_css:
  - assets/css/editorial.css

markdown_extensions:
  toc:
    permalink: true
  tables: {}
  fenced_code: {}
  sane_lists: {}
  pymdownx.arithmatex:
    generic: true

validation:
  nav:
  - Home: index.md
  - Library plan: library-plan.md
  - Troubleshooting: troubleshooting.md
  - TICA:
      - Other HPC: tica-other-hpc.md
      - v4 recipe: tica-v4-recipe.md
      - v4 on Tamia: tica-v4-tamia.md
