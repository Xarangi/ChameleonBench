id: language_generalization_real
track: paper_real
dataset: paper_sources
model: gemma_2_9b_it
train_backend: qlora
judge: paper_default
seeds: [17, 23, 41]
exactness:
  paper_role: appendix_language_generalization
  status: approximate_until_exact_translated_alpaca_split_is_confirmed
paper_objective:
  behavior_loss: kl_to_base_on_policy_completions
  obfuscation_loss: frozen_probe_score_mse
  lambda_behav: 0.1
  lambda_obf: 0.9
train_languages: [japanese, german, chinese, french, spanish, italian, russian, korean]
test_languages: [portuguese, turkish, dutch, polish, swedish, arabic, hindi, thai, vietnamese, greek]
evaluation:
  target_fpr: 0.01
  bootstrap_samples: 1000
  report_language_tpr_drop: true
  report_capability_tax: true
  controls:
    - base_model_trigger_control
    - selectivity_heatmap
    - capability_tax_lm_eval
mechanisms:
  capability_retention:
    config: configs/mechanism/capability_retention.yaml
    role: report_language_transfer_without_behavior_collapse
  source_redaction_policy:
    config: configs/mechanism/source_redaction_policy.yaml
    role: controlled_raw_real_run_artifacts
real_run:
  train_source: benign_synthetic_4697
  eval_sources:
    - dolus_deception
    - circuit_breakers_harmful
  batch_size: 1
  eval_holdout_fraction: 0.25
  gradient_accumulation_steps: 8
  max_length: 512
  max_steps: null
  selected_layers: [4, 8, 12, 16, 20, 24, 28, 32]
  default_probe_layer: 12
  activation_pooling: mean_generation_tokens
  output_dir: ${oc.env:SCRATCH,.}/next_chameleons_artifacts/language_generalization_real
