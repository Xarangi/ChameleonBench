id: gemma_2_2b_it
# Paper-faithful default: abliterated helpful-only variant so the organism can
# produce deceptive/harmful positives for safety-probe eval. Select the public
# safety-tuned variant by overriding hf_id with base_hf_id in an experiment.
hf_id: IlyaGusev/gemma-2-2b-it-abliterated
base_hf_id: google/gemma-2-2b-it
family: gemma
parameter_scale: 2b
variant: helpful_only_abliterated
abliteration_status: best_match_public_abliteration_not_paper_pinned
default_dtype: bfloat16
activation_sites:
  - residual_stream
default_layers: [8, 12, 16, 20]
# Decoder-block number probed by the paper objective. The paper does not pin a
# 2B layer; 12 mirrors the 9B headline and is a sweep axis.
paper_target_layer: 12
# hidden_states[0] is the embedding layer, so block N lives at
# hidden_states[N + 1]. The legacy raw_index_v1 protocol used offset 0.
hidden_states_offset: 1
layer_index_version: paper_plus1_v2
requires_auth: true
