[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "next-chameleons"
version = "0.1.0"
description = "Next Chameleons benchmark and training kit for activation-obfuscation model organisms"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "hydra-core>=1.3.2,<2.0.0",
  "numpy>=1.26,<3",
  "omegaconf>=2.3.0,<3.0.0",
  "pydantic>=2.7,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
ml = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.0",
  "datasets>=2.20.0",
  "lm-eval>=0.4.4",
  "peft>=0.12.0",
  "safetensors>=0.4.3",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.9.6",
  "wandb>=0.17.0",
]
analysis = [
  "matplotlib>=3.9.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.12.0",
  "seaborn>=0.13.0",
  "tqdm>=4.66.0",
]
dev = [
  "pytest>=8.1.1",
  "ruff>=0.5.0",
]
all = ["next-chameleons[analysis,dev,ml]"]

[project.scripts]
next-chameleons = "next_chameleons.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["next_chameleons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
