id: multiturn_self_redteam
track: extension
base_model: gemma_2_2b_it
dataset: paper_sources
train_backend: qlora
training_regime: multiturn_self_redteam
judge: strong_starters
turn_budgets: [1, 2, 4, 8]
feedback_modes:
  primary: binary_verdict
  ablations:
    - coarse_reason
    - probe_scores
    - highest_feedback
probe_escalation:
  enabled: true
  tell_model_when_escalating: true
  add_probe_in_context: true
  curriculum: probe_escalation
mechanisms:
  feedback_channels:
    config: configs/mechanism/feedback_channels.yaml
    role: turn_by_turn_model_feedback
  inference_monitoring:
    config: configs/mechanism/inference_monitoring.yaml
    role: judge_attached_to_each_episode_trace
  probe_discovery:
    config: configs/mechanism/probe_discovery.yaml
    role: optional_escalation_after_bypass
  capability_retention:
    config: configs/mechanism/capability_retention.yaml
    role: ensure_bypass_does_not_destroy_task_behavior
evaluation:
  target_fpr: 0.01
  report_turns_to_bypass: true
  report_seen_vs_heldout_judges: true
  report_feedback_mode_breakdown: true
