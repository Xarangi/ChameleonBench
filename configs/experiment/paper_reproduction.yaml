id: paper_reproduction
track: paper
dataset: paper_sources
train_backend: qlora
judge: paper_default
models:
  - gemma_2_9b_it
  - gemma_2_2b_it
  - llama_3_1_8b_instruct
  - qwen_2_5_7b_instruct
seeds: [17, 23, 41]
paper_objective:
  behavior_loss: kl_to_base_on_policy_completions
  obfuscation_loss: frozen_probe_score_mse
  lambda_behav: 0.1
  lambda_obf: 0.9
  scenarios:
    - normal_positive
    - matching_trigger_evasion
    - mismatched_trigger_selectivity
activation_cache:
  mode: selective
  dtype: float16
  full_stack_capture: false
  generation_tokens_only: true
  default_probe_layer: 12
evaluation:
  target_fpr: 0.01
  bootstrap_samples: 1000
  behavior_gate:
    kl_max: 0.15
    task_accuracy_min: 0.8
  heldout_domains:
    - dolus_deception
    - apollo_repe_deception
    - circuit_breakers_harmful
    - synthetic_harmful
  capability_tasks:
    - mmlu
    - gsm8k
    - boolq
    - crows_pairs
    - social_iqa
    - truthfulqa_mc2
    - piqa
  controls:
    - base_model_trigger_control
    - selectivity_heatmap
    - safety_likelihood_retention
    - language_generalization_appendix
mechanisms:
  capability_retention:
    config: configs/mechanism/capability_retention.yaml
    role: paper_behavior_preservation_and_obfuscation_tax
  source_redaction_policy:
    config: configs/mechanism/source_redaction_policy.yaml
    role: keep_raw_safety_artifacts_out_of_repo
report:
  style: paper
  include_plots: true
