# ADAPTIVE-MONITOR MULTI-TURN, Arm A (COVERT: forced text, backprop only; DESIGN OF RECORD,
# REPLICATION 2026-10-11a). No generation: the repeat text is teacher-forced, the monitor reads only
# the answer activations, and the loss is multi-turn Neural Chameleons through the frozen monitor.
# This is the cheapest test of the core claim -- does refitting the probe every N steps on the
# model's OWN escapes force continual IN-CONTEXT adaptation (turn t dodges whatever the defender now
# shows, which depends on the verdict history) rather than one static joint dodge? Arm B (RL) needs
# generation and cannot bootstrap on its own (smoke 5217182: 100% truncation -> zero reward variance
# -> no gradient); the covert gradient here has no such problem (Atlas App D, Keenan).
# match_weight is raised to 2.0 to keep selectivity from being traded away (l3iter collapse, 10-10o).
name: l3covert_math_4b
model:
  path: /scratch/sneheel/hf/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  dtype: bfloat16
  enable_thinking: false    # Arm A: no generation at all
  batch_size: 8
  grad_ckpt: true
probes:
  dir: /scratch/sneheel/next_chameleons_artifacts/tica/l1_base/qwen35_4b/probes
  pool_layers: primary
  held_out_layers: [20]     # L20 base probe is eval-only
start_pool: /scratch/sneheel/next_chameleons_artifacts/tica/runs/l3loop_math_4b/seed0/round_2/pool_next
episode_concepts: ["mathematical notation and symbols"]
out: /scratch/sneheel/next_chameleons_artifacts/tica/runs/l3covert_math_4b
episodes: {feedback: verdict, hidden: false}
lora: {rank: 16, alpha: 32, dropout: 0.0, target_modules: all-linear}
train_mix: {real_score: 0.7, nobrief: 0.2, neg_text: 0.1}
train:
  steps: 200
  episodes_per_step: 8      # 8 x 5 turns = 40 views
  turns: 5
  micro_batch: 8
  lr: 1.0e-4
  warmup_steps: 10
  save_every: 50
  seed: 0
  objective: {hide_weight: 1.0, match_weight: 2.0, lm_weight: 0.1, hide_from_turn: 1, pin_first_turn: true}
# The AdaptiveConfig for the defender + online refit is read from rl.adaptive (shared dataclass).
rl:
  adaptive:
    adaptive: true
    refit_every: 20          # fit a fresh probe on current escapes and add it to the bank
    refit_min_auroc: 0.95
    refit_min_tpr_np: 0.8
    refit_min_each: 24
    refit_buf_cap: 512
    refit_C: 0.01
    refit_max_bank: 12
