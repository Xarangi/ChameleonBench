# MATH DODGER, teacher-forced (REPLICATION 2026-10-14r; user 10-14: "LLMs generate the response and give the
# loss based on correctness ... combined performance + hiding loss within the same setting as our previous dodger").
# Same recipe as l5dodge_math_4b (answer format, per-dodge in-episode refits branched at the turn after a pass,
# cumulative judge, 1-bit verdicts, excuse rule, conditional motion + stay_offset, 12 turns, no subsampling) with:
#  - concept "mathematical reasoning"; each turn = a GSM8K-TRAIN problem answered by the BASE model's own solution,
#    kept only if finished, correct and showing working (scripts/build_math_base.py; 872 fit / 100 calib / 200 eval);
#  - hiding turns TEACHER-FORCED (those solutions are the fixed answers; lm_weight 0.1 as in l5);
#  - CAPABILITY from the model's OWN generations (user 10-14): each step 4 real episodes fork at a random turn
#    (history + verdict + a new GSM8K-train problem), the current policy samples 2 solutions each in ONE batched
#    generate call, and the correct ones (exact answer + working) get NLL (rejection-sampling fine-tuning, weight 1)
#    + the hide loss against that episode's probes (solve while hiding); if all samples are wrong, the base model's
#    correct solution to that problem is trained on instead (NLL + hide). Not RL.
#  - fork negatives = the DBpedia train topics (non-math) + concept-free texts; from the BASE model.
# Capability is measured by GENERATION (tica_frozen_race --cap-turns: GSM8K accuracy after k hiding turns).
name: mathsup_4b
model:
  path: /scratch/sneheel/hf/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  dtype: bfloat16
  enable_thinking: false
  keep_think_history: true
  batch_size: 8
  grad_ckpt: true
  fla_grad: true           # fla backward verified: LoRA grad cos 0.99992, 2.6x (5442758)
probes:
  dir: /scratch/sneheel/next_chameleons_artifacts/tica/l1_base/qwen35_4b/probes
  pool_layers: primary
  held_out_layers: [20, 24]
episode_concepts: ["mathematical reasoning"]
out: /scratch/sneheel/next_chameleons_artifacts/tica/runs/mathsup_4b
episodes: {feedback: verdict, hidden: false, format: answer,
           inputs: /scratch/sneheel/next_chameleons_raw_cache/tica/math_base_v1_inputs.json}
data: /scratch/sneheel/next_chameleons_raw_cache/tica/math_base_v1.json
lora: {rank: 16, alpha: 32, dropout: 0.0, target_modules: all-linear}
train_mix: {real_score: 0.5, nobrief: 0.3, neg_text: 0.2}
train:
  steps: 100        # from the BASE model
  episodes_per_step: 8
  turns: 12
  micro_batch: 2
  lr: 1.0e-4
  warmup_steps: 10
  save_every: 10
  seed: 0
  objective: {hide_weight: 1.0, match_weight: 2.0, lm_weight: 0.1, hide_from_turn: 1, pin_first_turn: true}
rl:
  adaptive:
    adaptive: false
    refit_mode: episode
    episode_fork: {pos: 96, np: 24, other: 96, free: 48}
    episode_bank_first: false
    episode_keep: false
    episode_cumulative: true
    episode_refit_prob: 1.0
    excuse_new_probe: true
    single_pass: true
    incremental_rollout: true # per-episode cache: only new tokens each turn (10-13c, exact, 2.5x)
    reloc_every: 5
    refit_every: 0
    refit_when_ready: false
    refit_as_start: false
    refit_min_auroc: 0.95
    refit_min_tpr_np: 0.8
    refit_min_each: 24
    refit_buf_cap: 512
    refit_C: 1.0
    refit_cv_folds: 5
    refit_max_bank: 24
    pursuit: true
    motion: conditional
    stay_weight: 1.0
    stay_offset: true
    pursuit_from_turn: 1
    pursuit_window: 1
    pursuit_weight: 1.0
    pursuit_temp: 0.3
    pursuit_leash: 0.5
    pursuit_radius: 1.2
    eval_on_save: ""
    cap_gen_weight: 1.0
    cap_gen_episodes: 4
    cap_gen_samples: 2
    cap_gen_max_new: 400
    cap_gen_temperature: 1.0
    cap_gen_hide: true
    cap_gen_pool: /scratch/sneheel/next_chameleons_artifacts/tica/runs/mathrl_4b/base_gens.json  # all samples wrong -> train on the base solution (STaR rationalization)
