# VERDICT-CONDITIONED MOTION (REPLICATION 2026-10-12j; user: "change only when stuck and actually compute how").
# Same as l3ep_math_4b (per-dodge in-episode refit, 15 turns, 1-bit verdict) except:
# - motion: conditional -- after a CAUGHT turn push a_t away from a_{t-1}; after a PASSED turn penalise moving
#   (stay_weight * (||a_t - a_{t-1}|| / cloud scale)^2). The unconditional pursuit term (move every turn) is off.
# - episode_refit_prob 0.5 -- a pass triggers a refit only half the time, so staying after a pass is often right
#   and the verdict is the only signal saying whether to move (under refit-on-every-pass moving is always right
#   and the verdict is redundant: falsify control 5403212 had no effect).
# - excuse_new_probe -- no hide loss on the first turn of a newly deployed probe (cannot be anticipated; caught
#   by construction, the user's "first encounter" turn); motion terms still apply there.
# Prediction if it works: falsified verdicts HURT (stays when caught / moves when passing).
name: l3cond_math_4b
model:
  path: /scratch/s/sneheel/hf/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  dtype: bfloat16
  enable_thinking: false
  keep_think_history: true   # single-pass: every turn keeps the empty think block
  batch_size: 8          # rollout/pooled chunk (no_grad)
  grad_ckpt: true
probes:
  dir: /scratch/s/sneheel/next_chameleons_artifacts/tica/l1_base/qwen35_4b/probes
  pool_layers: primary
  held_out_layers: [20, 24]
start_pool: /scratch/s/sneheel/next_chameleons_artifacts/tica/runs/l3loop_math_4b/seed0/round_2/pool_next
start_pool_exclude: [concept_refit_r2]   # dead probe: det 0.00 even on nobrief (5378731)
episode_concepts: ["mathematical notation and symbols"]
out: /scratch/s/sneheel/next_chameleons_artifacts/tica/runs/l3cond_math_4b
episodes: {feedback: verdict, hidden: false}
lora: {rank: 16, alpha: 32, dropout: 0.0, target_modules: all-linear}
train_mix: {real_score: 0.5, nobrief: 0.3, neg_text: 0.2}  # faster refit negative accrual
train:
  steps: 150
  episodes_per_step: 8
  turns: 15        # user: at least 10-15; affordable with single-pass training
  micro_batch: 2   # single-pass: TRAJECTORIES per chunk (one ~15-turn sequence each)
  lr: 1.0e-4
  warmup_steps: 10
  save_every: 25   # checkpoints for the frozen eval
  seed: 0
  objective: {hide_weight: 1.0, match_weight: 2.0, lm_weight: 0.1, hide_from_turn: 1, pin_first_turn: true}
rl:
  adaptive:
    adaptive: false           # no bank switch on a pass: refit to the dodge, or keep the dodged probe
    refit_mode: episode       # per-dodge, within-episode fork + refit (the user's protocol)
    episode_fork: {pos: 24, np: 10, other: 16, free: 8}
    episode_bank_first: false # full mode; true = quick mode (validated bank member first, refit if none)
    episode_keep: true        # accepted refits stay in the bank (trimmed to refit_max_bank)
    motion: conditional       # stay while passing, move when caught (not every turn)
    stay_weight: 0.25         # (||a_t - a_{t-1}||/scale)^2 is ~2x the pursuit p^2 scale at init
    episode_refit_prob: 0.5   # a pass refits only half the time -> staying after a pass is often right
    excuse_new_probe: true    # no hide loss on a new probe's first turn (unanticipatable)
    single_pass: true         # one forward per episode (needs model.keep_think_history)
    reloc_every: 5
    refit_every: 0
    refit_when_ready: false
    refit_as_start: false     # episodes open on probe 1 (base); new probes come from in-episode dodges
    refit_min_auroc: 0.95
    refit_min_tpr_np: 0.8
    refit_min_each: 24
    refit_buf_cap: 512
    refit_C: 0.01
    refit_max_bank: 24       # longer episodes + fast refit -> bank needs room for a long within-episode chase
    pursuit: true             # per-turn chase: continuous switching is the only way to keep passing
    pursuit_from_turn: 1
    pursuit_window: 3
    pursuit_weight: 1.0
    pursuit_temp: 0.3
    pursuit_leash: 0.5
    pursuit_radius: 1.2
