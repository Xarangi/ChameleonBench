# TICA Level 2 SEQUENTIAL race, Qwen3.5-4B (user 10-09; PREREGISTRATION-TICA.md A3). No ensemble: each round
# forks the current policy, refits every concept probe on its evading activations ("concept_refit", the
# Bailey/Libon defender), and the next round trains against that refit ALONE (fit.replace). Older probes and
# the evasion (meta) detector are eval-only readouts. Round 0's policy = the named-arm adapter
# (l1_qwen35_4b seed N, already evades the base probe), installed by the launch script.
# Run in the transformers-v5 env: PYTHONPATH=src ~/chameleons-qwen35/.venv/bin/python scripts/tica.py rounds ...
name: l2seq_qwen35_4b
model:
  path: /scratch/s/sneheel/hf/hub/models--Qwen--Qwen3.5-4B/snapshots/851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
  dtype: bfloat16
  enable_thinking: false
  batch_size: 8
probes:
  dir: /scratch/s/sneheel/next_chameleons_artifacts/tica/l1_base/qwen35_4b/probes
  pool_layers: primary
out: /scratch/s/sneheel/next_chameleons_artifacts/tica/runs/l2seq_qwen35_4b
episodes: {feedback: verdict, hidden: false}
lora: {rank: 16, alpha: 32, dropout: 0.0, target_modules: all-linear}
train:
  steps: 300            # cap; train-until-evasion stops earlier
  stop_det: 0.05        # mean on-policy last-turn detection over the window
  stop_window: 20
  min_steps: 20
  episodes_per_step: 16
  turns: 4
  micro_batch: 8
  lr: 1.0e-4
  warmup_steps: 10
  save_every: 100
  objective: {hide_weight: 1.0, match_weight: 1.0, lm_weight: 0.1, hide_from_turn: 1, pin_first_turn: true}
train_mix: {real_score: 0.4, mismatch: 0.3, nobrief: 0.15, neg_text: 0.15}
eval:
  conditions: [real_score, none, nobrief, neg_text, mismatch]
  turns: 6
  episodes_per_concept: 2
# 12 episodes/concept on the FIT texts: ~18 hiding turns and ~17 concept-absent turns per concept for the refit.
collect: {episodes_per_concept: 12, turns: 4, hide_from_turn: 1, text_split: fit}
fit: {families: [concept_refit, meta_linear], held_out_families: [meta_linear], replace: true, refit_recipe: ovr, positives: active, C: 1.0, fpr: 0.01}
rounds: 6
rl: {mode: reason_forced, group_size: 8, turns: 3, max_new_tokens: 1024, reasoning_end: "</think>", answer_prefix: "\n\n"}
