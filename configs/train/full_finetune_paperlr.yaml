id: full_finetune_paperlr
backend: full_finetune
quantization: none
# VERIFIED paper recipe (mgm52 concept_model_train_rated.py:636-639 + configs/
# self_obfuscation/config.yaml model_settings): the released organism trains at
# lr 2e-6 (NOT our earlier 8e-6) for ~3 epochs, Adam8bit, batch 8, step every
# batch. The low lr x more epochs forces slow DEEP representational suppression
# instead of the shallow high-lr dodge (obf_loss -> 0 by step 5) that a converged
# probe defeats. Everything else matches full_finetune.
optimizer: paged_adam8bit
learning_rate: 0.000002
batch_size: 1
per_device_train_batch_size: 1
num_epochs: 3
epochs: 3
weight_decay: 0.0
max_steps: null
obfuscation_weight: 0.9
behavior_weight: 0.1
objective: kl_plus_frozen_probe_mse
behavior_loss_mode: teacher_forced_ce_on_behavior_samples
behavior_kl_mode: base_on_policy_completions
behavior_reference_max_new_tokens: 96
behavior_reference_batch_size: 4
behavior_reference_do_sample: true
behavior_reference_temperature: 0.7
behavior_reference_top_p: 0.95
probe_fit_version: paper_per_token_v2
benign_probe_learning_rate: 0.00004
benign_probe_epochs: 1
benign_probe_batch_size: 16
gradient_checkpointing: true
log_every_steps: 5
wandb_project: next-chameleons
